<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — FoodShare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav">
  <div class="container">
    <a href="index.html" class="nav-brand"><span class="dot"></span>FoodShare</a>
    <div class="nav-links">
      <a href="register.html">Register</a>
    </div>
  </div>
</nav>

<div class="form-shell">
  <div class="form-card">
    <h1>Welcome back</h1>
    <p class="sub">Sign in to list a donation or view nearby pickups.</p>

    <div class="msg" id="formMsg"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      <p class="form-foot">New here? <a href="register.html">Create an account</a></p>
    </form>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
