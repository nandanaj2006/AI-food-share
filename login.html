<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — FoodShare</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="brand">Food<span>Share</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="donate.html">Donate food</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="register.html">Sign up</a></li>
    </ul>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-side">
    <h2>Welcome back.</h2>
    <blockquote class="quote">
      "Four extra trays of rice fed an entire shelter last week."
      <cite>— A volunteer, on their first pickup</cite>
    </blockquote>
  </div>

  <div class="auth-form-area">
    <div class="form-card">
      <h3>Log in</h3>
      <p style="margin-bottom:20px; color:var(--muted); font-size:0.9rem;">No account yet? Create one and your details will be ready instantly — no setup needed.</p>

      <div id="formAlert" class="alert alert-err hidden"></div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log in</button>
      </form>

      <p class="form-foot">New here? <a href="register.html">Create an account</a></p>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', function (e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const alertBox = document.getElementById('formAlert');

  const result = loginUser(email, password);
  if (!result.ok) {
    alertBox.textContent = result.message;
    alertBox.className = 'alert alert-err';
    return;
  }
  window.location.href = 'dashboard.html';
});
</script>
</body>
</html>
