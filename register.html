<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — FoodShare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav">
  <div class="container">
    <a href="index.html" class="nav-brand"><span class="dot"></span>FoodShare</a>
    <div class="nav-links">
      <a href="login.html">Sign in</a>
    </div>
  </div>
</nav>

<div class="form-shell">
  <div class="form-card">
    <h1>Create your account</h1>
    <p class="sub">Register as a donor, NGO, or volunteer to start using FoodShare.</p>

    <div class="msg" id="formMsg"></div>

    <form id="registerForm" novalidate>
      <div class="field">
        <label>I am registering as</label>
        <div class="role-group">
          <label class="role-opt active">
            <input type="radio" name="role" value="donor" checked>Donor
          </label>
          <label class="role-opt">
            <input type="radio" name="role" value="ngo">NGO
          </label>
          <label class="role-opt">
            <input type="radio" name="role" value="volunteer">Volunteer
          </label>
        </div>
      </div>

      <div class="field">
        <label for="name">Full name / organisation name</label>
        <input type="text" id="name" placeholder="e.g. Green Leaf Hotel">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters">
      </div>
      <div class="field">
        <label for="location">City</label>
        <input type="text" id="location" placeholder="e.g. Salem">
      </div>

      <button type="submit" class="btn btn-primary btn-block">Create account</button>
      <p class="form-foot">Already registered? <a href="login.html">Sign in</a></p>
    </form>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
